# RSI material-design logo, traced from rsi-logo.svg (embedded 1061x963 PNG)
# offline (the generator is not part of this repository), for send_cartesian_path.py:
#   ros2 run rapidcode_bringup send_cartesian_path.py recipe_rsi_logo_svg.yaml
#
# The blue disk's outer boundary is the circle (exact parametric `func`). The
# white 'RSi' letters are near-white pixels inside the disk, traced as closed
# `through` (Catmull-Rom) splines. The long drop-shadow is darker blue (not
# near-white), so it is intentionally NOT drawn. Sized so the circle has
# R=0.14375 m. Orientation convention: y-flip, no x-mirror.
# Verify anchor, drawing plane, tool orientation, and clearance before moving.

coordinates: relative

ready: [0.0, 0.0, -1.5708, 0.0, -1.5708, 0.0]

anchor:
  xyz: [-0.39, -0.13, 0.271]
  rpy: [3.141592653589793, 0.0, 3.141592653589793]

defaults:
  z: -0.02
  vel: 0.2
  acc: 0.2
  samples: 120

# Cartesian IK/interp step (bigger = faster planning); --eef-step overrides. Kept fine
# (0.003) since this is a small, precise logo.
eef_step: 0.003
scale: 0.8

segments:

  # Merged R+S letterform (38 traced points)
