# The execution bridge -> trajectory_execution params on move_group.
# MoveIt hands the planned, time-parameterized trajectory to the EXISTING
# rapidcode_passthrough_trajectory_controller via its FollowJointTrajectory action
# (/rapidcode_passthrough_trajectory_controller/follow_joint_trajectory). That
# controller is brought up by rapidcode_bringup elfin5.launch.py; the
# rapidcode_system plugin then streams each sampled point to the RapidCode
# MultiAxis (MovePVT). MoveIt does NOT start its own controllers here -- it only
# talks to yours.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - rapidcode_passthrough_trajectory_controller

  rapidcode_passthrough_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - elfin_joint1
      - elfin_joint2
      - elfin_joint3
      - elfin_joint4
      - elfin_joint5
      - elfin_joint6

# Don't let MoveIt activate/deactivate controllers -- the bringup owns lifecycle.
trajectory_execution:
  moveit_manage_controllers: false
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
