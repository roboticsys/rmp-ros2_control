# Cartesian velocity/acceleration limits for the Pilz LIN / CIRC generators
# (loaded into robot_description_planning). MoveItConfigsBuilder REQUIRES this file
# whenever the pilz_industrial_motion_planner pipeline is enabled -- to_moveit_configs()
# auto-loads it, and the launch errors if it is missing.
#
# PTP (joint-space, used by send_pilz_sequence.py) ignores these and uses the
# per-joint limits in joint_limits.yaml. These matter only for LIN/CIRC. Conservative
# starting values -- raise once Cartesian motion is proven.
cartesian_limits:
  max_trans_vel: 1.0      # m/s
  max_trans_acc: 2.25     # m/s^2
  max_trans_dec: -5.0     # m/s^2  (deceleration, negative)
  max_rot_vel: 1.57       # rad/s
